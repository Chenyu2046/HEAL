[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harman-code-quality-agent"
version = "0.1.0"
description = "Controlled C/C++ finding repair workflow with version-bound candidates."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
repair-agent = "repair_agent.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
